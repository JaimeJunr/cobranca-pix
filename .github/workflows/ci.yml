# Barato primeiro: lint (~1 min) -> testes no Postgres (~2 min) -> stack no Docker (~4 min).
# Cada etapa só roda se a anterior passou. Mudança só em Markdown não dispara nada.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations em dia com os models
        run: uv run python manage.py makemigrations --check --dry-run

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cobranca
          POSTGRES_USER: cobranca
          POSTGRES_PASSWORD: cobranca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cobranca" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cobranca:cobranca@localhost:5432/cobranca
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Testes com cobertura (mínimo de 90%)
        run: uv run pytest

  compose:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAIL_FIRST: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Sobe a stack inteira
        run: docker compose up -d --build --wait
      - name: Cria dados de demonstração
        run: docker compose exec -T web python manage.py seed_demo
      - name: Webhook de cobrança vencida chega depois do retry
        run: |
          # O beat marca a vencida a cada 30s; a primeira entrega falha (FAIL_FIRST=1)
          # e o Celery tenta de novo 10s depois.
          for _ in $(seq 1 24); do
            if docker compose logs webhook-receiver | grep -q "\[200\]"; then
              docker compose logs webhook-receiver
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
